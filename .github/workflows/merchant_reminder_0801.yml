name: 远行提醒第一轮

# 定义触发器：每天在 08:01 触发
on:
  schedule:
    # 使用 cron 语法定义精确的触发时间，格式：分 时 * * *
    - cron: '* * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  run-morning-task:
    runs-on: ubuntu-latest

    # --- 请添加下面这 3 行配置 ---
    env:
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
    # --- 添加结束 ---

    steps:
    # 步骤1：把代码下载到虚拟机中（升级到了 v5）
    - uses: actions/checkout@v5
    
    # 步骤2：在虚拟机中安装 Python 环境（升级到了 v6）
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    # 3. 安装依赖 (你的代码用到了 requests)
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 运行 08:00 脚本
    - name: 运行 0801.py (第一轮)
      run: python 0801.py
