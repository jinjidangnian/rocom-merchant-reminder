name: 远行提醒第四轮

# 定义触发器：每天在 20:01 触发
on:
  workflow_dispatch: # 允许手动触发

jobs:
  run-evening-task:
    runs-on: ubuntu-latest

    # --- 请添加下面这 3 行配置 ---
    env:
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
    # --- 添加结束 ---

    steps:
    # 步骤1：把代码下载到虚拟机中（升级到了 v5）
    - uses: actions/checkout@v5
    
    # 步骤2：在虚拟机中安装 Python 环境（升级到了 v6）
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    # 3. 安装依赖 (你的代码用到了 requests)
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 运行 20:00 脚本
    - name: 运行 2001.py (第四轮)
      run: python 2001.py
      env:  # 👇 这里非常关键，把 GitHub 的机密映射给 Python 进程的环境变量
          ROCOM_API_KEY: ${{ secrets.ROCOM_API_KEY }}
